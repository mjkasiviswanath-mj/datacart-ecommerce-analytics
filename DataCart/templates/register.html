<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - DataCart</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-2xl border border-slate-200 max-w-sm w-full space-y-4 shadow-sm">
        <h1 class="text-2xl font-bold text-center text-indigo-600">📊 DataCart</h1>
        <p class="text-xs text-slate-500 text-center">Create a new customer account</p>

        <form action="/login" method="GET" class="space-y-3 text-xs">
            <div>
                <label class="block font-semibold mb-1">Full Name</label>
                <input type="text" placeholder="John Doe" required class="w-full px-3 py-2 border rounded-lg">
            </div>
            <div>
                <label class="block font-semibold mb-1">Email</label>
                <input type="email" placeholder="name@example.com" required class="w-full px-3 py-2 border rounded-lg">
            </div>
            <div>
                <label class="block font-semibold mb-1">Password</label>
                <input type="password" placeholder="••••••••" required class="w-full px-3 py-2 border rounded-lg">
            </div>
            <button type="submit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg text-xs">Create Account</button>
        </form>

        <div class="text-center pt-2 text-xs">
            <a href="/login" class="text-indigo-600 hover:underline">Already have an account? Sign In</a>
        </div>
    </div>
</body>
</html>
