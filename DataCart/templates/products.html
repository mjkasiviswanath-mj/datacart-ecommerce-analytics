<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataCart - Products Catalog</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="/" class="text-xl font-bold text-indigo-600">📊 DataCart</a>
            <nav class="flex items-center gap-6 text-sm font-medium">
                <a href="/" class="text-slate-600 hover:text-slate-900">Home</a>
                <a href="/products" class="text-indigo-600 font-semibold">Products</a>
                <a href="/cart" class="text-slate-600 hover:text-slate-900">Cart</a>
                <a href="/orders" class="text-slate-600 hover:text-slate-900">My Orders</a>
                <a href="/analytics" class="text-slate-600 hover:text-slate-900">Analytics</a>
                <a href="/login" class="text-slate-600 hover:text-slate-900">Login</a>
            </nav>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 space-y-6">
        <div class="flex flex-col sm:flex-row justify-between items-baseline gap-4 border-b border-slate-200 pb-4">
            <div>
                <h1 class="text-2xl font-bold">Products Catalog</h1>
                <p class="text-xs text-slate-500">Filter by category or search item titles</p>
            </div>
            <div class="flex gap-2 text-xs">
                <a href="/products?category=All" class="px-3 py-1 bg-slate-200 rounded">All</a>
                <a href="/products?category=Electronics" class="px-3 py-1 bg-slate-200 rounded">Electronics</a>
                <a href="/products?category=Laptops" class="px-3 py-1 bg-slate-200 rounded">Laptops</a>
                <a href="/products?category=Books" class="px-3 py-1 bg-slate-200 rounded">Books</a>
                <a href="/products?category=Accessories" class="px-3 py-1 bg-slate-200 rounded">Accessories</a>
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            {% for p in products %}
            <div class="bg-white border border-slate-200 rounded-xl overflow-hidden flex flex-col justify-between">
                <img src="{{ p.image }}" alt="{{ p.name }}" class="h-48 w-full object-cover">
                <div class="p-4 flex-1 flex flex-col justify-between space-y-3">
                    <div>
                        <span class="text-xs text-indigo-600 font-semibold">{{ p.category }}</span>
                        <h3 class="font-bold text-sm text-slate-900 line-clamp-1">{{ p.name }}</h3>
                        <p class="text-xs text-slate-500 line-clamp-2 mt-1">{{ p.description }}</p>
                    </div>
                    <div class="flex items-center justify-between pt-2 border-t border-slate-100">
                        <span class="font-bold text-base">${{ p.price }}</span>
                        <a href="/product/{{ p.id }}" class="px-3 py-1.5 bg-indigo-600 text-white rounded text-xs font-semibold hover:bg-indigo-700">Details & ML</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </main>
</body>
</html>
