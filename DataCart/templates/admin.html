<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - DataCart</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="/admin" class="text-xl font-bold text-indigo-600">📊 DataCart Admin</a>
            <nav class="flex items-center gap-6 text-sm font-medium">
                <a href="/admin" class="text-indigo-600 font-semibold">Dashboard</a>
                <a href="/products" class="text-slate-600 hover:text-slate-900">Products</a>
                <a href="/analytics" class="text-slate-600 hover:text-slate-900">Analytics</a>
                <a href="/" class="text-slate-600 hover:text-slate-900">Storefront</a>
            </nav>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8 space-y-6">
        <h1 class="text-2xl font-bold">Administrator Dashboard</h1>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-white p-5 rounded-xl border border-slate-200">
                <span class="text-xs text-slate-500 font-semibold uppercase">Total Products</span>
                <div class="text-3xl font-extrabold text-slate-900 mt-1">{{ products_count }}</div>
            </div>
            <div class="bg-white p-5 rounded-xl border border-slate-200">
                <span class="text-xs text-slate-500 font-semibold uppercase">Total Customers</span>
                <div class="text-3xl font-extrabold text-slate-900 mt-1">{{ users_count }}</div>
            </div>
            <div class="bg-white p-5 rounded-xl border border-slate-200">
                <span class="text-xs text-slate-500 font-semibold uppercase">Total Orders</span>
                <div class="text-3xl font-extrabold text-slate-900 mt-1">{{ orders_count }}</div>
            </div>
            <div class="bg-white p-5 rounded-xl border border-slate-200">
                <span class="text-xs text-slate-500 font-semibold uppercase">Total Revenue</span>
                <div class="text-3xl font-extrabold text-slate-900 mt-1">${{ total_revenue }}</div>
            </div>
        </div>

        <div class="p-6 bg-white rounded-xl border border-slate-200 space-y-3">
            <h3 class="font-bold text-base">Quick Admin Links</h3>
            <div class="flex gap-3 text-xs font-semibold">
                <a href="/analytics" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">Open Sales & Data Analytics</a>
                <a href="/products" class="px-4 py-2 bg-slate-100 text-slate-700 rounded-lg hover:bg-slate-200">Manage Catalog</a>
            </div>
        </div>
    </main>
</body>
</html>
