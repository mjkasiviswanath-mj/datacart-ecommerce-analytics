<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - DataCart</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="/" class="text-xl font-bold text-indigo-600">📊 DataCart</a>
            <nav class="flex items-center gap-6 text-sm font-medium">
                <a href="/" class="text-slate-600 hover:text-slate-900">Home</a>
                <a href="/products" class="text-slate-600 hover:text-slate-900">Products</a>
                <a href="/cart" class="text-slate-600 hover:text-slate-900">Cart</a>
                <a href="/orders" class="text-indigo-600 font-semibold">My Orders</a>
                <a href="/analytics" class="text-slate-600 hover:text-slate-900">Analytics</a>
            </nav>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 space-y-4">
        <h1 class="text-2xl font-bold">My Order History</h1>
        <div class="space-y-3">
            {% for o in orders %}
            <div class="bg-white p-4 rounded-xl border border-slate-200 flex justify-between items-center text-xs">
                <div>
                    <span class="font-mono font-bold text-slate-900 text-sm">{{ o.id }}</span>
                    <div class="text-slate-400 mt-0.5">Date: {{ o.order_date }} • Payment: {{ o.payment_method }}</div>
                </div>
                <div class="text-right">
                    <div class="text-sm font-bold text-slate-900">${{ o.total_amount }}</div>
                    <span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-emerald-50 text-emerald-700">{{ o.status }}</span>
                </div>
            </div>
            {% else %}
            <div class="bg-white p-8 rounded-xl border border-slate-200 text-center text-slate-400 text-xs">
                No orders recorded yet.
            </div>
            {% endfor %}
        </div>
    </main>
</body>
</html>
