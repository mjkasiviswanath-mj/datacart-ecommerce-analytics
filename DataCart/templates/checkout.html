<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - DataCart</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">
    <header class="bg-white border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="/" class="text-xl font-bold text-indigo-600">📊 DataCart</a>
            <a href="/cart" class="text-xs text-slate-500 hover:text-slate-800">Back to Cart</a>
        </div>
    </header>

    <main class="max-w-xl mx-auto px-4 py-8">
        <div class="bg-white p-6 rounded-2xl border border-slate-200 space-y-4 shadow-sm">
            <h1 class="text-2xl font-bold">Checkout</h1>
            <p class="text-xs text-slate-500">Provide delivery address and select dummy payment method.</p>
            
            <form action="/checkout" method="POST" class="space-y-3 text-xs">
                <div>
                    <label class="block font-semibold mb-1">Customer Full Name</label>
                    <input type="text" name="name" value="Kasi" required class="w-full px-3 py-2 border rounded-lg">
                </div>
                <div>
                    <label class="block font-semibold mb-1">Email Address</label>
                    <input type="email" name="email" value="kasi@example.com" required class="w-full px-3 py-2 border rounded-lg">
                </div>
                <div>
                    <label class="block font-semibold mb-1">Delivery Address</label>
                    <input type="text" name="address" value="42 MG Road, Sector 14" required class="w-full px-3 py-2 border rounded-lg">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-semibold mb-1">City</label>
                        <input type="text" name="city" value="Bengaluru" required class="w-full px-3 py-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block font-semibold mb-1">Pincode</label>
                        <input type="text" name="pincode" value="560001" required class="w-full px-3 py-2 border rounded-lg">
                    </div>
                </div>
                <div>
                    <label class="block font-semibold mb-1">Payment Method</label>
                    <select name="payment_method" class="w-full px-3 py-2 border rounded-lg">
                        <option value="UPI">UPI / Google Pay</option>
                        <option value="Card">Credit / Debit Card</option>
                        <option value="Cash on Delivery">Cash on Delivery</option>
                    </select>
                </div>
                <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl mt-3">Place Order</button>
            </form>
        </div>
    </main>
</body>
</html>
